name: glowup-readiness

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: glowup_test
      POSTGRES_PASSWORD: local_readiness_only
      POSTGRES_DB: glowup_readiness_test
    ports:
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glowup_test -d glowup_readiness_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    cpus: 0.5
